# H2 In-Memory Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize schema and data from SQL files
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Flyway/Liquibase if present
spring.flyway.enabled=false

# JWT Test Configuration
jwt.secret=testSecretKeyForTestingPurposesOnlyMustBeLongEnough1234567890
jwt.expirationMs=3600000

# Test file upload directory
file.upload-dir=./test-uploads

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG