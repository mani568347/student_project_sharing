# MySQL Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sharing_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mani_5683}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=900000

server.port=${PORT:8084}

# Initialize schema from SQL files (only when DB is accessible)
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Lazy DB connection on startup - don't crash if DB takes time to be ready
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# Tolerant startup - application starts even if DB connection fails initially
spring.datasource.initialization-mode=always

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=superSecretKeyForTokenGenerationMustBeLongEnough1234567890
jwt.expirationMs=86400000
file.upload-dir=./uploads