# Maven Wrapper Configuration
# This file configures the Maven version and download URLs used by the wrapper.
# https://maven.apache.org/wrapper/

# The URL to download the Maven distribution
# By default, uses Maven Central repository
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.6/apache-maven-3.9.6-bin.zip

# Wrapper URL (alternative to distributionUrl for some configurations)
# wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.6/apache-maven-3.9.6-bin.zip

# Optional: Set the Maven repository to use for downloading
# wrapperRepositoryUrl=https://repo.maven.apache.org/maven2

# Optional: Set the timeout for downloading (in milliseconds)
# downloadTimeout=60000

# Optional: Set the checksum verification (sha256, sha1, md5, or none)
# checksumVerification=sha256

# Optional: Set the Maven version (extracted from distributionUrl if not set)
# mavenVersion=3.9.6