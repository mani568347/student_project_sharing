services:
  - type: web
    name: student-project-sharing
    env: java
    buildCommand: cd backend && ./mvnw package -DskipTests
    startCommand: cd backend && java -jar target/sharing-0.0.1-SNAPSHOT.jar --server.port=$PORT
    envVars:
      - key: PORT
        value: 8084
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
