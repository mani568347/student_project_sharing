services:
  - type: web
    name: student-project-sharing
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/projects/list
    envVars:
      - key: PORT
        value: 8084
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SERVER_PORT
        value: 8084
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms128m -Xmx320m -XX:+UseSerialGC"
